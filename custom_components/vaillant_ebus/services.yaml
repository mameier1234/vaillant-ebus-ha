set_schedule:
  fields:
    circuit:
      required: true
      example: hwc
      selector:
        select:
          options:
            - { value: mc, label: Heizung }
            - { value: hwc, label: Pufferladung }
            - { value: cc, label: Zirkulation }
    days:
      required: true
      example: weekend
      selector:
        select:
          options: [weekdays, weekend, monday, tuesday, wednesday, thursday, friday, saturday, sunday]
    slots:
      required: true
      example: '[{"from": "05:10", "to": "11:00"}, {"from": "12:00", "to": "21:30"}]'
      selector:
        object:

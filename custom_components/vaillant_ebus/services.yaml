set_schedule:
  fields:
    circuit:
      required: true
      example: hwc
      selector:
        select:
          options: [hwc, hc, mc, cc]
    days:
      required: true
      example: weekend
      selector:
        select:
          options: [weekdays, weekend]
    slots:
      required: true
      example: '[{"from": "05:10", "to": "11:00"}, {"from": "12:00", "to": "21:30"}]'
      selector:
        object:

hot_water_override:
  fields:
    hours:
      example: 48
      selector:
        number:
          min: 0.5
          max: 168
          step: 0.5
          unit_of_measurement: h
    until:
      selector:
        datetime:

